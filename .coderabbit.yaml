# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-CA"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    drafts: false
  # Files excluded here do not count toward CodeRabbit's per-PR file limit
  path_filters:
    # AI-DLC process documents (design, decisions, audit log), not product code
    - "!aidlc-docs/**"
    # Machine-translated strings are reviewed by a speaker of the language, not here. en.json stays in review.
    - "!packages/client/src/assets/i18n/ar.json"
    - "!packages/client/src/assets/i18n/de.json"
    - "!packages/client/src/assets/i18n/es.json"
    - "!packages/client/src/assets/i18n/fr.json"
    - "!packages/client/src/assets/i18n/id.json"
    - "!packages/client/src/assets/i18n/it.json"
    - "!packages/client/src/assets/i18n/pl.json"
    - "!packages/client/src/assets/i18n/pt.json"
    - "!packages/client/src/assets/i18n/uk.json"
    - "!packages/client/src/assets/i18n/zh.json"
  path_instructions:
    - path: "packages/client/**/*.spec.ts"
      instructions: 
        "Assess the unit test code employing the Jest testing framework. Test descriptions must be sufficiently detailed to clarify the purpose of each test."
      
chat:
  auto_reply: true