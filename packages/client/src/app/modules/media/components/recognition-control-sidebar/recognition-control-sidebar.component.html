<div class="flex flex-col p-3 gap-3 drop-shadow bg-base-300 rounded-s-xl">
  
    <button *ngIf="showRecognitionToggle" class="btn btn-md btn-primary" [ngClass]="{'bg-secondary': !recognitionActive()}" (click)="toggleRecognition()">
      <ng-icon name="heroPause"></ng-icon>
    </button>

    <details #fontSizeMenu class="dropdown dropdown-left">
      <summary class="btn btn-md btn-primary flex flex-col items-center" [ngClass]="{'bg-secondary': fontSizeMenu.hasAttribute('open'), 'tooltip tooltip-left tooltip-info': !fontSizeMenu.hasAttribute('open')}" role="button" [attr.data-tip]="'LABELS.textSize' | translate" (click)="hideElements([lineSpacingMenu, renderHistoryMenu])">
        <ng-icon name="tablerTextSize"></ng-icon>
        <div class="text-xs text-base-100" *ngIf="fontSizeMenu.hasAttribute('open')">{{'TEXT_SIZE.' + textSize() | translate}}</div>
      </summary>
      <div class="dropdown-content">
        <ul class="menu bg-secondary rounded-s-xl text-2xl gap-3">
          <li>
            <button class="btn btn-sm btn-primary tooltip tooltip-left" [attr.data-tip]="('LABELS.increase' | translate) + ' ' + ('LABELS.textSize' | translate)" [disabled]="textSizeMax()" (click)="increaseTextSize()">
              <ng-icon name="tablerTextIncrease"></ng-icon>
            </button>
          </li>
          <li>
            <button class="btn btn-sm btn-primary tooltip tooltip-left" [attr.data-tip]="('LABELS.decrease' | translate) + ' ' + ('LABELS.textSize' | translate)" [disabled]="textSizeMin()" (click)="decreaseTextSize()">
              <ng-icon name="tablerTextDecrease"></ng-icon>
            </button>
          </li>
        </ul>
      </div>
    </details>

    <details #lineSpacingMenu class="dropdown dropdown-left">
      <summary class="btn btn-md btn-primary flex flex-col items-center" [ngClass]="{'bg-secondary': lineSpacingMenu.hasAttribute('open'), 'tooltip tooltip-left tooltip-info': !lineSpacingMenu.hasAttribute('open')}" role="button" [attr.data-tip]="'LABELS.lineHeight' | translate" (click)="hideElements([fontSizeMenu, renderHistoryMenu])">
        <ng-icon name="tablerLineHeight"></ng-icon>
        <div class="text-xs text-base-100" *ngIf="lineSpacingMenu.hasAttribute('open')">{{'LINE_HEIGHT.' + lineHeight() | translate}}</div>
      </summary>
      <div class="dropdown-content">
        <ul class="menu bg-secondary rounded-s-xl text-2xl gap-3">
          <li>
            <button class="btn btn-sm btn-primary tooltip tooltip-left" [attr.data-tip]="('LABELS.increase' | translate) + ' ' + ('LABELS.lineHeight' | translate)" [disabled]="lineHeightMax()" (click)="increaseLineHeight()">
              <ng-icon name="tablerPlus"></ng-icon>
            </button>
          </li>
          <li>
            <button class="btn btn-sm btn-primary tooltip tooltip-left" [attr.data-tip]="('LABELS.decrease' | translate) + ' ' + ('LABELS.lineHeight' | translate)" [disabled]="lineHeightMin()" (click)="decreaseLineHeight()">
              <ng-icon name="tablerMinus"></ng-icon>
            </button>
          </li>
        </ul>
      </div>
    </details>

    <details #renderHistoryMenu class="dropdown dropdown-left">
      <summary class="btn btn-md btn-primary flex flex-col items-center" [ngClass]="{'bg-secondary': renderHistoryMenu.hasAttribute('open'), 'tooltip tooltip-left tooltip-info': !renderHistoryMenu.hasAttribute('open')}" role="button" [attr.data-tip]="'LABELS.renderHistory' | translate" (click)="hideElements([fontSizeMenu, lineSpacingMenu])">
        <ng-icon name="tablerHistory"></ng-icon>
        <div class="text-xs text-base-100" *ngIf="renderHistoryMenu.hasAttribute('open')">{{renderHistoryLength()}}</div>
      </summary>
      <div class="dropdown-content">
        <ul class="menu bg-secondary rounded-s-xl text-2xl gap-3">
          <li>
            <button class="btn btn-sm btn-primary tooltip tooltip-left" [attr.data-tip]="('LABELS.increase' | translate) + ' ' + ('LABELS.renderHistory' | translate)" [disabled]="renderHistoryMax()" (click)="increaseRenderHistory()">
              <ng-icon name="tablerPlus"></ng-icon>
            </button>
          </li>
          <li>
            <button class="btn btn-sm btn-primary tooltip tooltip-left" [attr.data-tip]="('LABELS.decrease' | translate) + ' ' + ('LABELS.renderHistory' | translate)" [disabled]="renderHistoryMin()" (click)="decreaseRenderHistory()">
              <ng-icon name="tablerMinus"></ng-icon>
            </button>
          </li>
        </ul>
      </div>
    </details>
    
    <details #translationMenu class="dropdown dropdown-left" *ngIf="translationAvailable()">
      <summary class="btn btn-md btn-primary flex flex-col items-center" [ngClass]="{'bg-secondary': translationMenu.hasAttribute('open'), 'tooltip tooltip-left tooltip-info': !translationMenu.hasAttribute('open')}" role="button" [attr.data-tip]="'SETTINGS.TABS.translation' | translate" (click)="hideElements([fontSizeMenu, lineSpacingMenu, renderHistoryMenu])">
        <ng-icon name="heroGlobeAlt"></ng-icon>
        <div class="text-[10px] text-base-100 uppercase" *ngIf="translationMenu.hasAttribute('open')">{{ translationMode() === 'split' ? 'SPLIT' : (translationMode() === 'translated-only' ? 'TRANS' : 'OFF') }}</div>
      </summary>
      <div class="dropdown-content">
        <div class="bg-secondary rounded-s-xl p-3 min-w-[220px] text-xs flex flex-col gap-2 shadow-xl border border-base-content/10">
          <div class="font-semibold text-base-100 text-[11px] uppercase tracking-wider">
            {{ 'SETTINGS.TRANSLATION.displayMode' | translate }}
          </div>
          <div class="grid grid-cols-3 gap-1">
            <button class="btn btn-xs" [ngClass]="{'btn-primary': translationMode() === 'split', 'btn-ghost text-base-100': translationMode() !== 'split'}" (click)="setTranslationMode('split')">
              {{ 'SETTINGS.TRANSLATION.modeSplit' | translate }}
            </button>
            <button class="btn btn-xs" [ngClass]="{'btn-primary': translationMode() === 'translated-only', 'btn-ghost text-base-100': translationMode() !== 'translated-only'}" (click)="setTranslationMode('translated-only')">
              {{ 'SETTINGS.TRANSLATION.modeTranslatedOnly' | translate }}
            </button>
            <button class="btn btn-xs" [ngClass]="{'btn-primary': translationMode() === 'off', 'btn-ghost text-base-100': translationMode() !== 'off'}" (click)="setTranslationMode('off')">
              {{ 'SETTINGS.TRANSLATION.off' | translate }}
            </button>
          </div>

          <div *ngIf="translationMode() === 'split' || (showPip && pipSupported && translationMode() !== 'off')" data-testid="zc-sidebar-layout" class="flex flex-col gap-1 mt-1">
            <ng-container *ngIf="translationMode() === 'split'">
              <label class="font-semibold text-base-100 text-[11px] uppercase tracking-wider">
                {{ 'SETTINGS.TRANSLATION.splitOrientation' | translate }}
              </label>
              <div class="flex items-center gap-1">
                <div class="grid grid-cols-2 gap-1 flex-grow">
                  <button class="btn btn-xs" data-testid="zc-sidebar-orientation-vertical" [ngClass]="{'btn-primary': splitOrientation() === 'vertical', 'btn-ghost text-base-100': splitOrientation() !== 'vertical'}" (click)="splitOrientation() !== 'vertical' && toggleOrientation()">
                    {{ 'SETTINGS.TRANSLATION.orientationStacked' | translate }}
                  </button>
                  <button class="btn btn-xs" data-testid="zc-sidebar-orientation-horizontal" [ngClass]="{'btn-primary': splitOrientation() === 'horizontal', 'btn-ghost text-base-100': splitOrientation() !== 'horizontal'}" (click)="splitOrientation() !== 'horizontal' && toggleOrientation()">
                    {{ 'SETTINGS.TRANSLATION.orientationSideBySide' | translate }}
                  </button>
                </div>
                <button type="button" class="btn btn-xs btn-square" data-testid="zc-sidebar-swap-panes"
                        (click)="swapPanes()"
                        [attr.aria-label]="'SETTINGS.TRANSLATION.swapPanes' | translate"
                        [title]="'SETTINGS.TRANSLATION.swapPanes' | translate">
                  <ng-icon name="heroArrowsUpDown"></ng-icon>
                </button>
              </div>
            </ng-container>
            <ng-container *ngIf="showPip && pipSupported && translationMode() !== 'off'">
              <label class="font-semibold text-base-100 text-[11px] uppercase tracking-wider mt-1">
                {{ 'SETTINGS.TRANSLATION.pipContent' | translate }}
              </label>
              <div class="grid grid-cols-3 gap-1">
                <button class="btn btn-xs" data-testid="zc-sidebar-pip-original" [ngClass]="{'btn-primary': pipContent() === 'original', 'btn-ghost text-base-100': pipContent() !== 'original'}" (click)="setPipContent('original')">
                  {{ 'SETTINGS.TRANSLATION.pipContentOriginal' | translate }}
                </button>
                <button class="btn btn-xs" data-testid="zc-sidebar-pip-translated" [ngClass]="{'btn-primary': pipContent() === 'translated', 'btn-ghost text-base-100': pipContent() !== 'translated'}" (click)="setPipContent('translated')">
                  {{ 'SETTINGS.TRANSLATION.pipContentTranslated' | translate }}
                </button>
                <button class="btn btn-xs" data-testid="zc-sidebar-pip-split" [ngClass]="{'btn-primary': pipContent() === 'split', 'btn-ghost text-base-100': pipContent() !== 'split'}" (click)="setPipContent('split')">
                  {{ 'SETTINGS.TRANSLATION.pipContentSplit' | translate }}
                </button>
              </div>
            </ng-container>
          </div>

          <div class="flex flex-col gap-1 mt-1">
            <label class="font-semibold text-base-100 text-[11px] uppercase tracking-wider">
              {{ 'SETTINGS.TRANSLATION.targetLang' | translate }}
            </label>
            <div class="flex items-center gap-1">
              <select data-testid="zc-sidebar-target-lang" class="select select-bordered select-xs w-full text-base-content bg-base-100" [value]="targetLanguage()" (change)="onTargetLanguageSelect($event)">
                <ng-container *ngIf="languageOptions().fromBroadcaster.length; else localOnly">
                  <optgroup [label]="'STREAM.fromBroadcaster' | translate">
                    <option *ngFor="let lang of languageOptions().fromBroadcaster" [value]="lang.code" [selected]="lang.code === targetLanguage()">
                      {{ lang.name }}
                    </option>
                  </optgroup>
                  <optgroup *ngIf="languageOptions().local.length" [label]="'STREAM.translatedOnDevice' | translate">
                    <option *ngFor="let lang of languageOptions().local" [value]="lang.code" [selected]="lang.code === targetLanguage()">
                      {{ lang.name }}
                    </option>
                  </optgroup>
                </ng-container>
                <ng-template #localOnly>
                  <option *ngFor="let lang of languageOptions().local" [value]="lang.code" [selected]="lang.code === targetLanguage()">
                    {{ lang.name }}
                  </option>
                </ng-template>
              </select>
            </div>
          </div>
        </div>
      </div>
    </details>

    <app-flow-direction *ngIf="showTextFlow"></app-flow-direction>
    
    <app-full-screen *ngIf="showFullscreen"></app-full-screen>

    <app-document-pip *ngIf="showPip"></app-document-pip>
</div>
